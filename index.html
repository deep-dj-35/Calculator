<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deep Jana Calculator</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        .calculator {
            background: #1e1e2f;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 300px;
        }

        .title {
            color: #7d98f9;
            margin-bottom: 10px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        #display {
            width: 100%;
            height: 60px;
            border: none;
            outline: none;
            text-align: right;
            font-size: 24px;
            padding: 1.5px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #2d2d44;
            color: #fff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            background: #3b3b5c;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #57578a;
            transform: scale(1.05);
        }

        .equal {
            background: #ff7a18;
        }

        .equal:hover {
            background: #ff9a3c;
        }

        .clear {
            background: #ff4b5c;
        }

        .clear:hover {
            background: #ff6b7a;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <div class="title">Deep Jana's Calculator</div>
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="appendValue('/')">/</button>
            <button onclick="appendValue('*')">*</button>
            <button onclick="appendValue('-')">-</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="calculate()" class="equal">=</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch {
                display.value = "Error";
            }
        }
    </script>

</body>

</html>
